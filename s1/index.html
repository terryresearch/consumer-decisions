<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Consumer Decision Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* The look of the Qualtrics files (custom CSS "lane look", 2026-11-24): zinc neutrals, Inter, one white card. */
:root {
  --bg: #fafafa; --card: #ffffff; --fg: #09090b; --muted: #71717a; --soft: #f4f4f5;
  --border: #e4e4e7; --border-strong: #d4d4d8; --primary: #18181b; --primary-fg: #fafafa;
  --ring: #a1a1aa; --danger: #dc2626; --radius: 12px;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { font-family: var(--font); color: var(--fg); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input { font-family: inherit; }

.progress { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: var(--border); z-index: 50; }
.progress > div { height: 4px; width: 0; background: var(--primary); transition: width .3s ease; }

.wrap { max-width: 640px; margin: 0 auto; padding: 48px 16px 40px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
        box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 28px 28px 24px; }
@media (max-width: 480px) { .wrap { padding: 28px 12px 24px; } .card { padding: 20px 16px 18px; } }

/* questions */
.q { margin: 0 0 28px; padding: 0; border: 0; }
.q:last-child { margin-bottom: 0; }
.qt { display: block; padding: 0 0 14px; margin: 0; font-size: 17px; font-weight: 500; line-height: 1.5; }
.qt p { margin: 0 0 10px; }
.qt p:last-child { margin-bottom: 0; }
.q-text .qt { font-weight: 400; font-size: 16px; padding-bottom: 0; }
.err { color: var(--danger); font-size: 14px; font-weight: 500; padding: 0 0 8px; }
.err[hidden] { display: none; }

/* vertical multiple choice: radio cards */
.mc { display: grid; gap: 8px; }
.opt { position: relative; display: flex; align-items: center; min-height: 48px; width: 100%; margin: 0;
       padding: 12px 14px 12px 46px; background: var(--card); color: var(--fg); border: 1px solid var(--border);
       border-radius: 10px; font-size: 16px; font-weight: 400; line-height: 1.4; cursor: pointer;
       transition: border-color .15s, background-color .15s, box-shadow .15s; }
.opt:hover { border-color: var(--muted); }
.opt input[type=radio] { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.opt::before { content: ""; position: absolute; left: 15px; top: 50%; width: 18px; height: 18px; margin-top: -9px;
               border: 1.5px solid var(--muted); border-radius: 50%; background: var(--card); box-sizing: border-box; }
.opt.on { border-color: var(--primary); background: var(--soft); box-shadow: inset 0 0 0 1px var(--primary); }
.opt.on::before { border: 5px solid var(--primary); }
.opt:has(input:focus-visible) { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ring); }
.opt-wrap { display: block; }
.txt.opt-text { display: block; margin: 8px 0 2px 46px; width: calc(100% - 46px); }
.txt.opt-text[hidden] { display: none; }

/* the six choice pages: two big tappable cards side by side */
.tap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.tap-card { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 76px;
            padding: 14px 10px; background: var(--card); color: var(--fg); border: 1px solid var(--border);
            border-radius: var(--radius); font-size: 18px; font-weight: 600; line-height: 1.3; cursor: pointer; }
.tap-card:hover { border-color: var(--muted); }
.tap-card:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ring); }
.tap-card.on { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }

/* Box B and its ticket table */
.hb-ask { margin: 0 0 14px !important; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.hb-box { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 16px 18px 6px; font-weight: 400; }
.hb-name { margin: 0 !important; font-size: 17px; font-weight: 600; }
.hb-sub { margin: 2px 0 10px !important; color: var(--muted); font-size: 15px; }
table.hb-t { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
table.hb-t th { text-align: left; padding: 8px 6px; color: var(--muted); font-weight: 500; font-size: 13px; border-bottom: 1px solid var(--border); }
table.hb-t td { padding: 10px 6px; border-bottom: 1px solid var(--border); }
table.hb-t tr:last-child td { border-bottom: 0; }
table.hb-t .r { text-align: right; }
table.hb-t th.r, table.hb-t td.r { width: 84px; }

/* horizontal 1 to 7 scale: a row of tiles */
.scale { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.tile { position: relative; display: flex; align-items: center; justify-content: center; height: 48px; margin: 0;
        border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: 17px; font-weight: 600;
        line-height: 1; cursor: pointer; }
.tile:hover { background: var(--soft); }
.tile input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.tile.on { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.tile:has(input:focus-visible) { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ring); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ends { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--muted); line-height: 1.3; }
.ends span:last-child { text-align: right; }

/* text entry */
.txt { height: 44px; padding: 8px 12px; margin: 0; font-size: 16px; color: var(--fg); background: var(--card);
       border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: none; outline: none; }
.txt:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(161,161,170,.45); }
.txt.num { width: 120px; max-width: 100%; }

/* sliders: no handle until the first touch, the number shows over the handle as it moves */
.sl { position: relative; }
.sl-valrow { position: relative; height: 36px; margin: 4px 0 10px; }
.sl-val { position: absolute; left: 0; top: 0; min-width: 56px; height: 36px; padding: 0 10px; display: inline-flex;
          align-items: center; justify-content: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums;
          color: var(--fg); background: var(--soft); border: 1px solid var(--border); border-radius: 8px; }
.sl-val.empty { color: var(--ring); font-weight: 500; }
.sl-nums { position: relative; height: 14px; margin: 0 0 16px; }
.sl-nums span { position: absolute; top: 0; font-size: 14px; line-height: 1; color: #52525b; font-variant-numeric: tabular-nums;
                white-space: nowrap; transform: translateX(-50%); }
.sl-nums span:first-child { transform: none; }
.sl-nums span:last-child { transform: translateX(-100%); }
@media (max-width: 480px) { .sl-nums span { font-size: 13px; } .sl-nums span:nth-child(even) { visibility: hidden; } }
.sl-track { position: relative; height: 24px; cursor: pointer; touch-action: none; outline: none; -webkit-tap-highlight-color: transparent; }
.sl-rail, .sl-fill { position: absolute; left: 0; top: 9px; height: 6px; border-radius: 999px; }
.sl-rail { right: 0; background: var(--border); }
.sl-fill { width: 0; background: var(--primary); }
.sl-thumb { position: absolute; top: 1px; left: 0; width: 22px; height: 22px; margin-left: -11px; box-sizing: border-box;
            border: 2px solid var(--primary); border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.2); cursor: grab; }
.sl.untouched .sl-thumb, .sl.untouched .sl-fill { visibility: hidden; }
.sl-track:focus-visible .sl-rail { box-shadow: 0 0 0 3px rgba(161,161,170,.6); }

/* the leaflet (Study 3) */
.hb-leaflet { background: #ffffff; border: 1px solid var(--border-strong); border-radius: 4px; border-top: 4px solid var(--primary);
              padding: 20px 22px 16px; margin: 0; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.05);
              font-size: 15px; line-height: 1.5; color: var(--fg); font-weight: 400; }
.hb-leaflet h3 { margin: 0 0 8px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.hb-leaflet p { margin: 0 0 10px; }
.hb-leaflet ul { margin: 0 0 12px; padding: 0 0 0 20px; list-style: square; }
.hb-leaflet li { margin: 3px 0; padding-left: 2px; }
.hb-leaflet .hb-leaflet-foot { margin: 0; padding-top: 10px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }

/* instruction and debrief lines */
.hb-lines { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.hb-lines li { position: relative; padding-left: 18px; margin: 0; }
.hb-lines li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--ring); }

/* Next */
.buttons { margin: 8px 0 0; text-align: right; }
.buttons[hidden] { display: none; }
.btn { min-width: 112px; height: 44px; padding: 0 20px; margin: 0; background: var(--primary); color: var(--primary-fg); border: 0;
       border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
.btn:hover { opacity: .88; }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ring); }
@media (max-width: 480px) { .btn { width: 100%; } }
.note { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
.note.bad { color: var(--danger); }
.end p { margin: 0 0 12px; }
.end p:last-child { margin-bottom: 0; }
.end a { color: var(--fg); font-weight: 600; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; letter-spacing: .04em; }
noscript p { margin: 0; }
</style>
</head>

d to participate in this study because you signed up at the research platform where you found this study. You can participate in this study if you are over the age of 18 and fluent in English. Your participation is voluntary.<\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">I am doing research on how people make different decisions as consumers. The Terry College of Business is paying for the study.<\/p><p style=\"margin:20px 0 8px;font-size:16px;font-weight:600;line-height:1.4;\"><strong>How long will this study be?<\/strong><\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">The study is expected to take about 2 minutes to complete. You can complete it at your own pace. The study will be entirely online.<\/p><p style=\"margin:20px 0 8px;font-size:16px;font-weight:600;line-height:1.4;\"><strong>What will happen if I take part in this research study?<\/strong><\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">If you agree to participate in this study, you will read some scenarios and answer some questions about them and your background. During the study, you may not be made fully aware of or be misled about the nature or purpose of the study.<\/p><p style=\"margin:20px 0 8px;font-size:16px;font-weight:600;line-height:1.4;\"><strong>Study Participation and Early Withdrawal<\/strong><\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">If, for any reason, you choose not to continue your participation, you can terminate your participation at any time. If you decide to stop or withdraw from the study or the investigator terminates your participation, the information/data collected from or about you up to the point of your withdrawal will be kept as part of the study and may continue to be analyzed.<\/p><p style=\"margin:20px 0 8px;font-size:16px;font-weight:600;line-height:1.4;\"><strong>What are the risks of participating in the study?<\/strong><\/p><p style=\"margin:20px 0 8px;font-size:16px;font-weight:600;line-height:1.4;\"><strong>Risk of Completing Tasks<\/strong><\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">You may find the task to be boring. If so, you may take a break at any time. You can refuse to take part or stop at any time without penalty. Your decision to participate or not will not impact your eligibility to participate in other studies on the platform.<\/p><p style=\"margin:20px 0 8px;font-size:16px;font-weight:600;line-height:1.4;\"><strong>Questionnaire/Survey Risks<\/strong><\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">The study does not involve more than minimal risks.<\/p><p style=\"margin:20px 0 8px;font-size:16px;font-weight:600;line-height:1.4;\"><strong>Loss of Confidentiality<\/strong><\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">The study does not directly collect any personally identifiable information. Any personally identifiable information the participant platform may provide me (e.g., your Prolific ID) will be kept in a separate file and not linked to your responses. No one, including the researchers, can link your responses to your identity. This research involves the transmission of data over the Internet. Every reasonable effort has been taken to ensure the effective use of available technology; however, confidentiality during online communication cannot be guaranteed.<\/p><p style=\"margin:20px 0 8px;font-size:16px;font-weight:600;line-height:1.4;\"><strong>Are there any benefits from being in this research study?<\/strong><\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">Your responses will help us better understand how people make decisions in different contexts. You will not receive any benefits personally.<\/p><p style=\"margin:20px 0 8px;font-size:16px;font-weight:600;line-height:1.4;\"><strong>What alternatives are available?<\/strong><\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">You may choose not to take part in this research study.<\/p><p style=\"margin:20px 0 8px;font-size:16px;font-weight:600;line-height:1.4;\"><strong>How Will You Keep My Study Records Confidential?<\/strong><\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">Your information will be kept in password-protected computers at the University of Georgia. Antivirus software and firewalls have been installed to protect these computers.<\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">The following people or groups may review your study records for purposes such as quality control or safety:<\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">The Researcher and any member of the research team<\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">The Institutional Review Board at the University of Georgia.  The Institutional Review Board is a group of people who review human research studies for the safety and protection of people who take part in the studies.<\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">The sponsor or funding agency for this study<\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">Federal and state agencies that oversee or review research<\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">The results of this research study may be published or used for teaching. I will not put identifiable information on data that are used for these purposes.<\/p><p style=\"margin:20px 0 8px;font-size:16px;font-weight:600;line-height:1.4;\"><strong>Sending Study Information to Research Collaborators Outside the University of Georgia<\/strong><\/p><p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;\">In compliance with data sharing practices of the Association for Psychological Science and American Psychological Association, I might make de-identified data from any published study available to researchers who request it. The data may be shared with other researchers or used for future studies without any additional consent after   }

  /* ------------------------------------------------------------------ moving on */
  function note(msg, bad) { var n = document.getElementById("note"); if (!n) return; n.textContent = msg; n.className = "note" + (bad ? " bad" : ""); n.hidden = !msg; }

  function next() {
    if (!cur || cur.busy) return;
    var firstBad = null;
    cur.items.forEach(function (el) {
      if (!el.valid) return;
      var m = el.valid();
      if (m) { el.err.textContent = m; el.err.hidden = false; if (!firstBad) firstBad = el.node; }
    });
    if (firstBad) { firstBad.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    cur.busy = true;
    var page = cur.page;
    cur.items.forEach(function (el) { if (el.collect) el.collect(S.answers); });
    S.timers[page.timer] = { first: cur.first, last: cur.last, submit: Math.round(performance.now() - cur.t0) / 1000, clicks: cur.clicks };

    if (page.decline && S.answers[page.decline.key] === page.decline.value) return decline();
    if (page.assignAfter && !S.cell) return startCell();
    advance();
  }

  function advance() {
    S.idx += 1;
    if (S.idx >= S.pages.length) return finish();
    save();
    send("in_progress", true).catch(function (e) { console.warn("submit", e); });
    render();
  }

  function startCell() {
    var btn = document.getElementById("next");
    btn.disabled = true; btn.textContent = "Starting\u2026"; note("");
    var meta = deviceInfo();
    meta.is_test = IS_TEST; meta.prolific_study_id = Q.get("STUDY_ID") || ""; meta.prolific_session_id = Q.get("SESSION_ID") || "";
    rpc("assign", { p_study: SPEC.study, p_pid: S.pid, p_session: S.session, p_meta: meta }).then(function (a) {
      if (!a || !SPEC.cells[a.condition]) throw new Error("bad cell " + JSON.stringify(a));
      S.cell = a.condition; S.assignSource = a.source;
      advance();
    }).catch(function (e) {
      console.error(e);
      cur.busy = false; btn.disabled = false; btn.textContent = "Next";
      note("We could not start the study. Please check your connection and press Next again.", true);
    });
  }

  function decline() {
    S.status = "declined"; S.finishedAt = Date.now(); save();
    send("declined", true).catch(function (e) { console.warn("submit", e); });
    showDeclined();
  }

  function finish() {
    S.idx = S.pages.length; S.status = "complete"; S.finishedAt = Date.now(); save();
    var btn = document.getElementById("next");
    if (btn) { btn.disabled = true; btn.textContent = "Saving\u2026"; }
    var tries = 0;
    var attempt = function () {
      tries += 1;
      send("complete", false).then(function () { showDone(true); }).catch(function (e) {
        console.error(e);
        if (tries < 3) return setTimeout(attempt, 1200 * tries);
        logEvent("submit_failed", { msg: String(e).slice(0, 200) });
        showRetry();
      });
    };
    attempt();
  }

  function showRetry() {
    setProgress(S.pages.length);
    card.innerHTML = '<div class="end"><p>We could not save your answers. Please check your internet connection and press <strong>Try again</strong>.</p>' +
      '<div class="buttons" style="text-align:left"><button type="button" class="btn" id="retry">Try again</button></div>' +
      '<p class="note" id="fallback" hidden>If this keeps happening, return to Prolific with this completion code: <span class="code">' +
      esc(SPEC.completionCode) + '</span> or <a href="' + esc(SPEC.completionUrl) + '">click here</a>.</p></div>';
    var fails = 0;
    document.getElementById("retry").addEventListener("click", function () {
      var b = this; b.disabled = true; b.textContent = "Saving\u2026";
      send("complete", false).then(function () { showDone(true); }).catch(function () {
        fails += 1; b.disabled = false; b.textContent = "Try again";
        document.getElementById("fallback").hidden = false;
      });
    });
  }

  function showDone(go) {
    setProgress(S.pages.length);
    card.innerHTML = '<div class="end"><p>Thank you. Taking you back to Prolific\u2026</p>' +
      '<p class="note">If nothing happens, <a href="' + esc(SPEC.completionUrl) + '">click here</a> or enter the completion code <span class="code">' +
      esc(SPEC.completionCode) + "</span> on Prolific.</p></div>";
    if (go && !PREVIEW) location.replace(SPEC.completionUrl);
  }

  function showDeclined() {
    setProgress(S.pages.length);
    card.innerHTML = '<div class="end">' + SPEC.declineHtml + "</div>";
  }

  /* preview only (file:// or localhost): ?preview=<cell>&page=<page id> */
  if (PREVIEW) {
    S.cell = PREVIEW; S.assignSource = "preview";
    var jump = Q.get("page");
    if (jump && S.pages.indexOf(jump) >= 0) S.idx = S.pages.indexOf(jump);
  }
  window.__STUDY = { S: S, SPEC: SPEC, payload: payload };
  render();
})();
</script>
</body>
</html>
